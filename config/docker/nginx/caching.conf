 # Assets whose name carries a content hash never change, so they are cached forever.
 # Everything else revalidates, so a restarted container is never shadowed by a cached copy.
 map $uri $redoc_cache_control {
   default                                        "no-cache";
   "~^/(.*/)?redoc\.standalone\.[0-9a-f]+\.js$"   "public, max-age=31536000, immutable";
   "~^/(.*/)?styles\.[0-9a-f]+\.css$"             "public, max-age=31536000, immutable";
 }

 add_header 'Cache-Control' $redoc_cache_control;
