openapi: 3.0.3
info:
  title: A chain of discriminator hosts that refs point into
  version: '2024-01-01'
  description: >
    Each host refs the next one twice, and each option refs a property of its host. The samples
    must stay within the depth limit instead of doubling per host.
paths:
  /chains:
    post:
      tags: [samples]
      summary: Create a chain
      operationId: createChain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/H0'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/H0'
components:
  schemas:
    # A chain of hosts whose variants ref a host property; each host refs the next one twice.
    H0:
      {
        type: object,
        properties:
          {
            kind: { type: string },
            a: { $ref: '#/components/schemas/H1' },
            b: { $ref: '#/components/schemas/H1' },
          },
        discriminator: { propertyName: kind },
        oneOf: [{ $ref: '#/components/schemas/H0X' }, { $ref: '#/components/schemas/H0Y' }],
      }
    H0X: { type: object, properties: { kind: { $ref: '#/components/schemas/H0/properties/kind' } } }
    H0Y: { type: object, properties: { kind: { $ref: '#/components/schemas/H0/properties/kind' } } }
