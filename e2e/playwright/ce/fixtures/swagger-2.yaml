# Swagger 2.0 document for the standalone loader's conversion path: body parameter,
# securityDefinitions, definitions with allOf, and host/basePath/schemes.
swagger: '2.0'
info:
  title: Petstore (Swagger 2.0)
  version: '1.0.0'
host: petstore.example.test
basePath: /v2
schemes: [https]
consumes: [application/json]
produces: [application/json]
securityDefinitions:
  api_key:
    type: apiKey
    name: api_key
    in: header
tags:
  - name: pets
paths:
  /pets:
    get:
      tags: [pets]
      summary: List pets
      operationId: listPets
      parameters:
        - name: limit
          in: query
          type: integer
          format: int32
      responses:
        '200':
          description: A list of pets
          schema:
            type: array
            items:
              $ref: '#/definitions/Pet'
    post:
      tags: [pets]
      summary: Create a pet
      operationId: createPet
      security:
        - api_key: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/NewPet'
      responses:
        '201':
          description: Created
          schema:
            $ref: '#/definitions/Pet'
definitions:
  NewPet:
    type: object
    required: [name]
    properties:
      name:
        type: string
        example: Rex
      tag:
        type: string
  Pet:
    allOf:
      - $ref: '#/definitions/NewPet'
      - type: object
        required: [id]
        properties:
          id:
            type: integer
            format: int64
