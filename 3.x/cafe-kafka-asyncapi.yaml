asyncapi: 3.0.0
info:
  title: Redocly Cafe Streams
  version: 1.4.0
  description: >
    The **Redocly Cafe** event backbone, running entirely on Apache Kafka.


    Every topic here is a multi-event stream: a single topic carries several
    related event types, so consumers subscribe once and switch on the
    `eventType` header. Pick a message from the selector on each operation to
    see its headers, payload, and examples.


    | Topic | Events | Key |

    |---|---|---|

    | `cafe.orders.v1` | 4 order lifecycle events | `orderId` |

    | `cafe.payments.v1` | 3 payment events | `orderId` |

    | `cafe.{storeId}.inventory.v1` | 2 stock events | `sku` |

    | `cafe.loyalty.v1` | 2 loyalty events | `memberId` |

    | `cafe.pricing.requests.v1` | quote requests (request/reply) | `quoteId` |

    | `cafe.orders.v1.dlq` | poison messages | original key |


    All events are correlated by the `correlationId` header, which carries the
    `orderId` for order, payment, and pricing streams.
  termsOfService: https://redocly.com/subscription-agreement
  contact:
    name: Redocly Cafe Platform Team
    email: team@redocly.com
    url: https://redocly.com/contact-us/
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  externalDocs:
    description: Redocly Cafe event catalog
    url: https://redocly.com/docs
  tags:
    - name: orders
      description: Order lifecycle stream
    - name: payments
      description: Authorization, capture, and refund events
    - name: inventory
      description: Per-store stock movements
    - name: loyalty
      description: Points and reward redemptions
    - name: pricing
      description: Synchronous price quotes over Kafka request/reply
    - name: operations
      description: Dead-letter handling
defaultContentType: application/json
servers:
  production:
    host: '{clusterHost}:9093'
    protocol: kafka-secure
    protocolVersion: 3.6.0
    title: Cafe production cluster
    summary: TLS + SASL/SCRAM production Kafka cluster
    description: |
      Six-broker cluster spread across three availability zones.
      Requires SASL/SCRAM-SHA-512 credentials issued by the platform team,
      and a client truststore containing the internal CA.
    variables:
      clusterHost:
        default: kafka.cafe.redocly.com
        description: Bootstrap server hostname
        enum:
          - kafka.cafe.redocly.com
          - kafka-eu.cafe.redocly.com
    security:
      - $ref: '#/components/securitySchemes/saslScram'
    tags:
      - name: production
    bindings:
      kafka:
        schemaRegistryUrl: https://schema-registry.cafe.redocly.com
        schemaRegistryVendor: confluent
        bindingVersion: 0.5.0
  staging:
    host: kafka-staging.cafe.redocly.com:9092
    protocol: kafka
    protocolVersion: 3.6.0
    title: Cafe staging cluster
    summary: Single-broker cluster for integration tests
    description: |
      Plaintext listener, no authentication. Topics are recreated nightly,
      so do not rely on retained data.
    bindings:
      kafka:
        schemaRegistryUrl: https://schema-registry-staging.cafe.redocly.com
        schemaRegistryVendor: confluent
        bindingVersion: 0.5.0
channels:
  orders:
    address: cafe.orders.v1
    title: Order events
    description: >-
      The order lifecycle stream. Compacted by `orderId`, so replaying the topic
      from the beginning rebuilds the current state of every order.
    servers:
      - $ref: '#/servers/production'
      - $ref: '#/servers/staging'
    messages:
      orderPlaced:
        $ref: '#/components/messages/orderPlaced'
      orderStatusChanged:
        $ref: '#/components/messages/orderStatusChanged'
      orderCancelled:
        $ref: '#/components/messages/orderCancelled'
      orderCompleted:
        $ref: '#/components/messages/orderCompleted'
    tags:
      - name: orders
    bindings:
      kafka:
        topic: cafe.orders.v1
        partitions: 12
        replicas: 3
        topicConfiguration:
          cleanup.policy:
            - compact
            - delete
          retention.ms: 2592000000
          retention.bytes: 10737418240
          delete.retention.ms: 86400000
          max.message.bytes: 1048576
        bindingVersion: 0.5.0
  payments:
    address: cafe.payments.v1
    title: Payment events
    description: >-
      Emitted by the payment service after the gateway confirms each state
      transition. Never contains full card data — only the network token suffix.
    servers:
      - $ref: '#/servers/production'
    messages:
      paymentAuthorized:
        $ref: '#/components/messages/paymentAuthorized'
      paymentCaptured:
        $ref: '#/components/messages/paymentCaptured'
      paymentRefunded:
        $ref: '#/components/messages/paymentRefunded'
    tags:
      - name: payments
    bindings:
      kafka:
        topic: cafe.payments.v1
        partitions: 6
        replicas: 3
        topicConfiguration:
          cleanup.policy:
            - delete
          retention.ms: 15552000000
        bindingVersion: 0.5.0
  inventory:
    address: cafe.{storeId}.inventory.v1
    title: Inventory events
    description: >-
      One topic per store, so a busy flagship location cannot starve the others.
      Keyed by SKU and compacted, giving each store a live stock snapshot.
    parameters:
      storeId:
        $ref: '#/components/parameters/storeId'
    servers:
      - $ref: '#/servers/production'
    messages:
      stockLevelChanged:
        $ref: '#/components/messages/stockLevelChanged'
      stockDepleted:
        $ref: '#/components/messages/stockDepleted'
    tags:
      - name: inventory
    bindings:
      kafka:
        topic: cafe.{storeId}.inventory.v1
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy:
            - compact
          segment.ms: 604800000
        bindingVersion: 0.5.0
  loyalty:
    address: cafe.loyalty.v1
    title: Loyalty events
    description: Points accrual and reward redemptions for cafe members.
    servers:
      - $ref: '#/servers/production'
    messages:
      pointsEarned:
        $ref: '#/components/messages/pointsEarned'
      rewardRedeemed:
        $ref: '#/components/messages/rewardRedeemed'
    tags:
      - name: loyalty
    bindings:
      kafka:
        topic: cafe.loyalty.v1
        partitions: 6
        replicas: 3
        topicConfiguration:
          cleanup.policy:
            - delete
          retention.ms: 31536000000
        bindingVersion: 0.5.0
  priceQuoteRequests:
    address: cafe.pricing.requests.v1
    title: Price quote requests
    description: >-
      Request side of the Kafka request/reply pair used by the point-of-sale
      terminals to price a basket before checkout.
    servers:
      - $ref: '#/servers/production'
    messages:
      priceQuoteRequested:
        $ref: '#/components/messages/priceQuoteRequested'
    tags:
      - name: pricing
    bindings:
      kafka:
        topic: cafe.pricing.requests.v1
        partitions: 6
        replicas: 3
        topicConfiguration:
          cleanup.policy:
            - delete
          retention.ms: 600000
        bindingVersion: 0.5.0
  priceQuoteReplies:
    address: cafe.pricing.replies.v1
    title: Price quote replies
    description: >-
      Reply side of the pricing exchange. The pricing service echoes the
      `correlationId` header from the request so the caller can match responses.
    servers:
      - $ref: '#/servers/production'
    messages:
      priceQuoteProvided:
        $ref: '#/components/messages/priceQuoteProvided'
      priceQuoteRejected:
        $ref: '#/components/messages/priceQuoteRejected'
    tags:
      - name: pricing
    bindings:
      kafka:
        topic: cafe.pricing.replies.v1
        partitions: 6
        replicas: 3
        topicConfiguration:
          cleanup.policy:
            - delete
          retention.ms: 600000
        bindingVersion: 0.5.0
  ordersDeadLetter:
    address: cafe.orders.v1.dlq
    title: Order dead letters
    description: >-
      Messages the order consumers could not process after five attempts.
      The original record is preserved verbatim so it can be replayed.
    servers:
      - $ref: '#/servers/production'
    messages:
      deadLetter:
        $ref: '#/components/messages/deadLetter'
    tags:
      - name: operations
    bindings:
      kafka:
        topic: cafe.orders.v1.dlq
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy:
            - delete
          retention.ms: 1209600000
        bindingVersion: 0.5.0
operations:
  publishOrderEvents:
    action: send
    channel:
      $ref: '#/channels/orders'
    title: Publish order events
    summary: Produced by the order service on every lifecycle transition.
    description: |
      All four event types share the topic and the `orderId` partition key, so
      a single order's events are strictly ordered.

      Producers run with `acks=all`, `enable.idempotence=true`, and
      `max.in.flight.requests.per.connection=5`.
    tags:
      - name: orders
    messages:
      - $ref: '#/channels/orders/messages/orderPlaced'
      - $ref: '#/channels/orders/messages/orderStatusChanged'
      - $ref: '#/channels/orders/messages/orderCancelled'
      - $ref: '#/channels/orders/messages/orderCompleted'
    bindings:
      kafka:
        clientId:
          type: string
          const: cafe-order-service
        bindingVersion: 0.5.0
  consumeOrderEvents:
    action: receive
    channel:
      $ref: '#/channels/orders'
    title: Consume order events
    summary: Consumed by the pickup display, the customer app, and analytics.
    description: |
      Delivery is at-least-once, so consumers must be idempotent — deduplicate
      on the `eventId` header. Records that fail five attempts are forwarded to
      `cafe.orders.v1.dlq`.
    tags:
      - name: orders
    messages:
      - $ref: '#/channels/orders/messages/orderPlaced'
      - $ref: '#/channels/orders/messages/orderStatusChanged'
      - $ref: '#/channels/orders/messages/orderCompleted'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - pickup-display
            - customer-app
            - analytics-sink
        clientId:
          type: string
          description: Consumer instance identifier, usually the pod name.
        bindingVersion: 0.5.0
  publishPaymentEvents:
    action: send
    channel:
      $ref: '#/channels/payments'
    title: Publish payment events
    summary: Produced by the payment service once the gateway responds.
    description: |
      Written inside the same transaction as the payment ledger row, using
      `transactional.id=cafe-payment-service-<instance>`, so consumers reading
      with `isolation.level=read_committed` never observe a rolled-back payment.
    tags:
      - name: payments
    messages:
      - $ref: '#/channels/payments/messages/paymentAuthorized'
      - $ref: '#/channels/payments/messages/paymentCaptured'
      - $ref: '#/channels/payments/messages/paymentRefunded'
    bindings:
      kafka:
        clientId:
          type: string
          const: cafe-payment-service
        bindingVersion: 0.5.0
  consumePaymentEvents:
    action: receive
    channel:
      $ref: '#/channels/payments'
    title: Consume payment events
    summary: Consumed by the ledger reconciler and the finance export job.
    tags:
      - name: payments
    messages:
      - $ref: '#/channels/payments/messages/paymentCaptured'
      - $ref: '#/channels/payments/messages/paymentRefunded'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - ledger-reconciler
            - finance-export
        bindingVersion: 0.5.0
  consumeInventoryEvents:
    action: receive
    channel:
      $ref: '#/channels/inventory'
    title: Consume inventory events
    summary: Consumed by the menu service to hide sold-out items.
    description: |
      The menu service materializes the compacted topic into a local state
      store, so a restart replays the topic instead of querying the inventory
      database.
    tags:
      - name: inventory
    messages:
      - $ref: '#/channels/inventory/messages/stockLevelChanged'
      - $ref: '#/channels/inventory/messages/stockDepleted'
    bindings:
      kafka:
        groupId:
          type: string
          const: menu-service
        bindingVersion: 0.5.0
  publishLoyaltyEvents:
    action: send
    channel:
      $ref: '#/channels/loyalty'
    title: Publish loyalty events
    summary: Produced by the loyalty service after each qualifying order.
    tags:
      - name: loyalty
    messages:
      - $ref: '#/channels/loyalty/messages/pointsEarned'
      - $ref: '#/channels/loyalty/messages/rewardRedeemed'
    bindings:
      kafka:
        clientId:
          type: string
          const: cafe-loyalty-service
        bindingVersion: 0.5.0
  requestPriceQuote:
    action: send
    channel:
      $ref: '#/channels/priceQuoteRequests'
    title: Request a price quote
    summary: Sent by a point-of-sale terminal to price a basket.
    description: |
      Set the `replyTopic` header to `cafe.pricing.replies.v1` and keep the
      `correlationId` — the pricing service echoes it on the reply. Terminals
      time out after 2 seconds and fall back to the cached price list.
    tags:
      - name: pricing
    messages:
      - $ref: '#/channels/priceQuoteRequests/messages/priceQuoteRequested'
    reply:
      channel:
        $ref: '#/channels/priceQuoteReplies'
      messages:
        - $ref: '#/channels/priceQuoteReplies/messages/priceQuoteProvided'
        - $ref: '#/channels/priceQuoteReplies/messages/priceQuoteRejected'
    bindings:
      kafka:
        clientId:
          type: string
          const: cafe-pos-terminal
        bindingVersion: 0.5.0
  consumeDeadLetters:
    action: receive
    channel:
      $ref: '#/channels/ordersDeadLetter'
    title: Consume dead letters
    summary: Consumed by the on-call replay tool.
    description: |
      Inspect `failure.reason` before replaying. Replays are published back to
      `cafe.orders.v1` with the original key and an added `replayOf` header.
    tags:
      - name: operations
    messages:
      - $ref: '#/channels/ordersDeadLetter/messages/deadLetter'
    bindings:
      kafka:
        groupId:
          type: string
          const: dlq-replay-tool
        bindingVersion: 0.5.0
components:
  securitySchemes:
    saslScram:
      type: scramSha512
      description: SASL/SCRAM-SHA-512 credentials issued per service.
  correlationIds:
    orderCorrelation:
      description: Correlates every event that belongs to one order.
      location: $message.header#/correlationId
    quoteCorrelation:
      description: Ties a price quote reply back to its request.
      location: $message.header#/correlationId
    memberCorrelation:
      description: Correlates loyalty activity for one member.
      location: $message.header#/correlationId
  parameters:
    storeId:
      description: Store identifier, printed on the till receipt.
      default: sf-market-st
      enum:
        - sf-market-st
        - sf-mission
        - berlin-mitte
      examples:
        - sf-market-st
  messages:
    orderPlaced:
      name: OrderPlaced
      title: Order placed
      summary: A customer checked out at the register or in the app.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/orderCorrelation'
      tags:
        - name: orders
      headers:
        $ref: '#/components/schemas/orderEventHeaders'
      payload:
        $ref: '#/components/schemas/orderPlacedPayload'
      examples:
        - name: espressoToGo
          summary: Single espresso, paid by card
          headers:
            eventId: evt_01k2f7n8p9qr3st4uv5wx6yz70
            eventType: order.placed
            eventVersion: '1'
            correlationId: ord_01h1s5z6vf2mm1mz3hevnn9va7
            sourceService: pos
            producedAt: '2026-07-21T08:15:00Z'
          payload:
            orderId: ord_01h1s5z6vf2mm1mz3hevnn9va7
            storeId: sf-market-st
            customerName: Ada Lovelace
            channel: pos
            items:
              - menuItemId: prd_01khr487f7qm7p44xn427m43vb
                name: Espresso
                quantity: 1
                unitPrice: 350
            totalPrice: 350
            placedAt: '2026-07-21T08:15:00Z'
        - name: morningRush
          summary: Large mobile-app order with a pastry
          headers:
            eventId: evt_01k2f7n8p9qr3st4uv5wx6yz71
            eventType: order.placed
            eventVersion: '1'
            correlationId: ord_01h1s5z6vf2mm1mz3hevnn9vb2
            sourceService: mobile-app
            producedAt: '2026-07-21T08:17:42Z'
          payload:
            orderId: ord_01h1s5z6vf2mm1mz3hevnn9vb2
            storeId: sf-market-st
            customerName: Grace Hopper
            channel: mobile-app
            items:
              - menuItemId: prd_01khr487f7qm7p44xn427m43vb
                name: Flat White
                quantity: 2
                unitPrice: 450
              - menuItemId: prd_01khr487f7qm7p44xn427m43xd
                name: Cinnamon Roll
                quantity: 1
                unitPrice: 400
            totalPrice: 1300
            placedAt: '2026-07-21T08:17:42Z'
      bindings:
        kafka:
          key:
            type: string
            description: Partition key — the order ID.
            examples:
              - ord_01h1s5z6vf2mm1mz3hevnn9va7
          schemaIdLocation: header
          schemaIdPayloadEncoding: confluent
          schemaLookupStrategy: TopicRecordNameStrategy
          bindingVersion: 0.5.0
    orderStatusChanged:
      name: OrderStatusChanged
      title: Order status changed
      summary: The kitchen or barista moved an order to a new status.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/orderCorrelation'
      tags:
        - name: orders
      headers:
        $ref: '#/components/schemas/orderEventHeaders'
      payload:
        $ref: '#/components/schemas/orderStatusChangedPayload'
      examples:
        - name: nowPreparing
          summary: Barista picked up the ticket
          headers:
            eventId: evt_01k2f7n8p9qr3st4uv5wx6yz72
            eventType: order.status-changed
            eventVersion: '1'
            correlationId: ord_01h1s5z6vf2mm1mz3hevnn9va7
            sourceService: kitchen
            producedAt: '2026-07-21T08:16:04Z'
          payload:
            orderId: ord_01h1s5z6vf2mm1mz3hevnn9va7
            previousStatus: placed
            status: preparing
            changedAt: '2026-07-21T08:16:04Z'
        - name: readyForPickup
          summary: Drinks are on the pickup shelf
          headers:
            eventId: evt_01k2f7n8p9qr3st4uv5wx6yz73
            eventType: order.status-changed
            eventVersion: '1'
            correlationId: ord_01h1s5z6vf2mm1mz3hevnn9va7
            sourceService: kitchen
            producedAt: '2026-07-21T08:19:10Z'
          payload:
            orderId: ord_01h1s5z6vf2mm1mz3hevnn9va7
            previousStatus: preparing
            status: ready
            changedAt: '2026-07-21T08:19:10Z'
      bindings:
        kafka:
          key:
            type: string
            description: Partition key — the order ID.
          schemaIdLocation: header
          bindingVersion: 0.5.0
    orderCancelled:
      name: OrderCancelled
      title: Order cancelled
      summary: The order was cancelled before it was handed over.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/orderCorrelation'
      tags:
        - name: orders
      headers:
        $ref: '#/components/schemas/orderEventHeaders'
      payload:
        $ref: '#/components/schemas/orderCancelledPayload'
      examples:
        - name: cancelledInApp
          summary: Customer cancelled before preparation started
          headers:
            eventId: evt_01k2f7n8p9qr3st4uv5wx6yz74
            eventType: order.cancelled
            eventVersion: '1'
            correlationId: ord_01h1s5z6vf2mm1mz3hevnn9vb2
            sourceService: mobile-app
            producedAt: '2026-07-21T08:18:03Z'
          payload:
            orderId: ord_01h1s5z6vf2mm1mz3hevnn9vb2
            cancelledBy: customer
            reason: Customer cancelled in the app.
            refundDue: true
            refundAmount: 1300
            cancelledAt: '2026-07-21T08:18:03Z'
        - name: outOfStock
          summary: Store cancelled after a key ingredient ran out
          headers:
            eventId: evt_01k2f7n8p9qr3st4uv5wx6yz75
            eventType: order.cancelled
            eventVersion: '1'
            correlationId: ord_01h1s5z6vf2mm1mz3hevnn9vc9
            sourceService: kitchen
            producedAt: '2026-07-21T08:20:41Z'
          payload:
            orderId: ord_01h1s5z6vf2mm1mz3hevnn9vc9
            cancelledBy: store
            reason: Oat milk unavailable and no substitution accepted.
            refundDue: true
            refundAmount: 900
            cancelledAt: '2026-07-21T08:20:41Z'
      bindings:
        kafka:
          key:
            type: string
            description: Partition key — the order ID.
          bindingVersion: 0.5.0
    orderCompleted:
      name: OrderCompleted
      title: Order completed
      summary: The customer collected the order — terminal event for the stream.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/orderCorrelation'
      tags:
        - name: orders
      headers:
        $ref: '#/components/schemas/orderEventHeaders'
      payload:
        $ref: '#/components/schemas/orderCompletedPayload'
      examples:
        - name: pickedUp
          summary: Order collected two minutes after it was ready
          headers:
            eventId: evt_01k2f7n8p9qr3st4uv5wx6yz76
            eventType: order.completed
            eventVersion: '1'
            correlationId: ord_01h1s5z6vf2mm1mz3hevnn9va7
            sourceService: pickup-counter
            producedAt: '2026-07-21T08:22:05Z'
          payload:
            orderId: ord_01h1s5z6vf2mm1mz3hevnn9va7
            storeId: sf-market-st
            totalPrice: 350
            fulfilmentSeconds: 425
            completedAt: '2026-07-21T08:22:05Z'
      bindings:
        kafka:
          key:
            type: string
            description: Partition key — the order ID.
          bindingVersion: 0.5.0
    paymentAuthorized:
      name: PaymentAuthorized
      title: Payment authorized
      summary: The gateway placed a hold on the customer's funds.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/orderCorrelation'
      tags:
        - name: payments
      headers:
        $ref: '#/components/schemas/paymentEventHeaders'
      payload:
        $ref: '#/components/schemas/paymentAuthorizedPayload'
      examples:
        - name: cardHold
          summary: Contactless card authorized for the full basket
          headers:
            eventId: evt_01k2f7n8p9qr3st4uv5wx6yz80
            eventType: payment.authorized
            eventVersion: '2'
            correlationId: ord_01h1s5z6vf2mm1mz3hevnn9va7
            sourceService: payment-service
            producedAt: '2026-07-21T08:15:01Z'
          payload:
            paymentId: pay_01h1s5z6vf2mm1mz3hevnn9pa1
            orderId: ord_01h1s5z6vf2mm1mz3hevnn9va7
            amount: 350
            currency: USD
            method: card
            cardLast4: '4242'
            authorizationCode: A1B2C3
            authorizedAt: '2026-07-21T08:15:01Z'
      bindings:
        kafka:
          key:
            type: string
            description: Partition key — the order ID.
          bindingVersion: 0.5.0
    paymentCaptured:
      name: PaymentCaptured
      title: Payment captured
      summary: Funds were captured once the order was handed over.
      contentType: application/json
      correlationId:
        $ref: '#/components/correlationIds/orderCorrelation'
      tags:
        - name: payments
      headers:
        $ref: '#/components/schemas/paymentEventHeaders'
      payload:
        $ref: '#/components/schemas/paymentCapturedPayload'
      examples:
        - name: fullCapture
          summary: Captured the full authorized amount
          headers:
            eventId: evt_01k2f7n8p9qr3st4uv5wx6yz81
            eventType: payment.captured
            eventVersion: '2'
            correlationId: ord_01h1s5z6vf2mm1mz3hevnn9va7
            sourceService: payment-service
            producedAt: '2026-07-21T08:22:06Z'
          payload:
            paymentId: pay_01h1s5z6vf2mm1mz3hevnn9pa1
            orderId: ord_01h1s5z6vf2mm1mz3hevnn9va7
            capturedAmount: 350
            currency: USD
            tipAmount: 0
            capturedAt: '2026-07-21T08:22:06Z'
        - name: captureWithTip
          summary: Customer added a tip at the terminal
          headers:
            eventId: evt_01k2f7n8p9qr3st4uv5wx6yz82
            eventType: payment.captured
            eventVersion: '2'
            correlationId: ord_01h1s5z6vf2mm1mz3hevnn9vb2
            sourceService: payment-service
            producedAt: '2026-07-21T08:24:12Z'
          payload:
