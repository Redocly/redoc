    deadLetter:
      name: DeadLetter
      title: Dead letter
      summary: An order event that could not be processed after five attempts.
      contentType: application/json
      tags:
        - name: operations
      headers:
        $ref: '#/components/schemas/deadLetterHeaders'
      payload:
        $ref: '#/components/schemas/deadLetterPayload'
      examples:
        - name: schemaMismatch
          summary: Payload failed schema validation on the consumer
          headers:
            failure.reason: SCHEMA_VALIDATION_FAILED
            failure.attempts: 5
            original.topic: cafe.orders.v1
            original.partition: 7
            original.offset: 918273
            producedAt: '2026-07-21T08:31:44Z'
          payload:
            originalTopic: cafe.orders.v1
            originalPartition: 7
            originalOffset: 918273
            originalKey: ord_01h1s5z6vf2mm1mz3hevnn9vc9
            originalValue: '{"orderId":"ord_01h1s5z6vf2mm1mz3hevnn9vc9","status":"prepairing"}'
            consumerGroup: pickup-display
            error: '"prepairing" is not a valid order status.'
            failedAt: '2026-07-21T08:31:44Z'
      bindings:
        kafka:
          key:
            type: string
            description: The key of the original record, copied verbatim.
          bindingVersion: 0.5.0
  schemas:
    orderEventHeaders:
      type: object
      description: Headers present on every message in `cafe.orders.v1`.
      required:
        - eventId
        - eventType
        - correlationId
        - producedAt
      properties:
        eventId:
          type: string
          format: ulid
          description: Unique event ID. Consumers deduplicate on this value.
        eventType:
          type: string
          description: Discriminates the event types multiplexed on this topic.
          enum:
            - order.placed
            - order.status-changed
            - order.cancelled
            - order.completed
        eventVersion:
          type: string
          description: Schema version of the payload.
          default: '1'
        correlationId:
          type: string
          format: ulid
          description: The order ID, shared by every event for this order.
        sourceService:
          type: string
          description: Service that produced the event.
          enum:
            - pos
            - mobile-app
            - kiosk
            - kitchen
            - pickup-counter
        producedAt:
          type: string
          format: date-time
    paymentEventHeaders:
      type: object
      required:
        - eventId
        - eventType
        - correlationId
        - producedAt
      properties:
        eventId:
          type: string
          format: ulid
        eventType:
          type: string
          enum:
            - payment.authorized
            - payment.captured
            - payment.refunded
        eventVersion:
          type: string
          default: '2'
        correlationId:
          type: string
          format: ulid
          description: The order ID this payment belongs to.
        sourceService:
          type: string
          const: payment-service
        producedAt:
          type: string
          format: date-time
    inventoryEventHeaders:
      type: object
      required:
        - eventId
        - eventType
        - storeId
        - producedAt
      properties:
        eventId:
          type: string
          format: ulid
        eventType:
          type: string
          enum:
            - inventory.stock-level-changed
            - inventory.stock-depleted
        eventVersion:
          type: string
          default: '1'
        storeId:
          type: string
          description: Store the reading came from.
        producedAt:
          type: string
          format: date-time
    loyaltyEventHeaders:
      type: object
      required:
        - eventId
        - eventType
        - correlationId
        - producedAt
      properties:
        eventId:
          type: string
          format: ulid
        eventType:
          type: string
          enum:
            - loyalty.points-earned
            - loyalty.reward-redeemed
        eventVersion:
          type: string
          default: '1'
        correlationId:
          type: string
          format: ulid
          description: The member ID.
        producedAt:
          type: string
          format: date-time
    quoteRequestHeaders:
      type: object
      required:
        - correlationId
        - replyTopic
      properties:
        correlationId:
          type: string
          format: ulid
          description: Echoed on the reply so the caller can match it.
        replyTopic:
          type: string
          description: Topic the pricing service publishes the reply to.
          const: cafe.pricing.replies.v1
        producedAt:
          type: string
          format: date-time
    quoteReplyHeaders:
      type: object
      required:
        - correlationId
      properties:
        correlationId:
          type: string
          format: ulid
          description: Copied from the originating request.
        producedAt:
          type: string
          format: date-time
    deadLetterHeaders:
      type: object
      required:
        - failure.reason
        - original.topic
      properties:
        failure.reason:
          type: string
          enum:
            - SCHEMA_VALIDATION_FAILED
            - DESERIALIZATION_FAILED
            - DOWNSTREAM_UNAVAILABLE
            - UNKNOWN_EVENT_TYPE
        failure.attempts:
          type: integer
          minimum: 1
        original.topic:
          type: string
        original.partition:
          type: integer
          minimum: 0
        original.offset:
          type: integer
          minimum: 0
        producedAt:
          type: string
          format: date-time
    orderPlacedPayload:
      type: object
      required:
        - orderId
        - storeId
        - items
        - totalPrice
        - placedAt
      properties:
        orderId:
          type: string
          format: ulid
          description: Order ID, prefixed with `ord_`.
        storeId:
          type: string
          description: Store that took the order.
        customerName:
          type: string
          description: Name called out at the pickup counter.
        channel:
          type: string
          description: Where the order was taken.
          enum:
            - pos
            - mobile-app
            - kiosk
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/orderLine'
        totalPrice:
          type: integer
          description: Total order price in cents.
          minimum: 0
        placedAt:
          type: string
          format: date-time
    orderLine:
      type: object
      required:
        - menuItemId
        - quantity
        - unitPrice
      properties:
        menuItemId:
          type: string
          format: ulid
          description: Menu item ID, prefixed with `prd_`.
        name:
          type: string
          description: Display name at the time of ordering.
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: integer
          description: Price per unit in cents.
          minimum: 0
    orderStatusChangedPayload:
      type: object
      required:
        - orderId
        - status
        - changedAt
      properties:
        orderId:
          type: string
          format: ulid
        previousStatus:
          $ref: '#/components/schemas/orderStatus'
        status:
          $ref: '#/components/schemas/orderStatus'
        changedAt:
          type: string
          format: date-time
    orderStatus:
      type: string
      description: Order lifecycle status.
      enum:
        - placed
        - preparing
        - ready
        - completed
        - cancelled
    orderCancelledPayload:
      type: object
      required:
        - orderId
        - cancelledBy
        - cancelledAt
      properties:
        orderId:
          type: string
          format: ulid
        cancelledBy:
          type: string
          description: Who initiated the cancellation.
          enum:
            - customer
            - store
            - system
        reason:
          type: string
          description: Human-readable explanation shown in the app.
        refundDue:
          type: boolean
          description: Whether the payment service must issue a refund.
        refundAmount:
          type: integer
          description: Amount to refund in cents. Absent when no payment was taken.
          minimum: 0
        cancelledAt:
          type: string
          format: date-time
    orderCompletedPayload:
      type: object
      required:
        - orderId
        - storeId
        - completedAt
      properties:
        orderId:
          type: string
          format: ulid
        storeId:
          type: string
        totalPrice:
          type: integer
          description: Final charged amount in cents.
          minimum: 0
        fulfilmentSeconds:
          type: integer
          description: Time from order placed to handover.
          minimum: 0
        completedAt:
          type: string
          format: date-time
    paymentAuthorizedPayload:
      type: object
      required:
        - paymentId
        - orderId
        - amount
        - currency
        - method
        - authorizedAt
      properties:
        paymentId:
          type: string
          format: ulid
          description: Payment ID, prefixed with `pay_`.
        orderId:
          type: string
          format: ulid
        amount:
          type: integer
          description: Authorized amount in cents.
          minimum: 0
        currency:
          $ref: '#/components/schemas/currency'
        method:
          type: string
          enum:
            - card
            - wallet
            - cash
            - loyalty-points
        cardLast4:
          type: string
          description: Last four digits of the network token, for receipts only.
          pattern: '^[0-9]{4}$'
        authorizationCode:
          type: string
          description: Code returned by the acquirer.
        authorizedAt:
          type: string
          format: date-time
    paymentCapturedPayload:
      type: object
      required:
        - paymentId
        - orderId
        - capturedAmount
        - currency
        - capturedAt
      properties:
        paymentId:
          type: string
          format: ulid
        orderId:
          type: string
          format: ulid
        capturedAmount:
          type: integer
          description: Captured amount in cents, including any tip.
          minimum: 0
        currency:
          $ref: '#/components/schemas/currency'
        tipAmount:
          type: integer
          description: Tip added at the terminal, in cents.
          minimum: 0
        capturedAt:
          type: string
          format: date-time
    paymentRefundedPayload:
      type: object
      required:
        - paymentId
        - orderId
        - refundId
        - refundedAmount
        - currency
        - refundedAt
      properties:
        paymentId:
          type: string
          format: ulid
        orderId:
          type: string
          format: ulid
        refundId:
          type: string
          format: ulid
          description: Refund ID, prefixed with `rfn_`.
        refundedAmount:
          type: integer
          description: Refunded amount in cents.
          minimum: 0
        currency:
          $ref: '#/components/schemas/currency'
        reason:
          type: string
          enum:
            - order-cancelled
            - quality-complaint
            - duplicate-charge
            - goodwill
        refundedAt:
          type: string
          format: date-time
    currency:
      type: string
      description: ISO 4217 currency code.
      enum:
        - USD
        - EUR
        - GBP
    stockLevelChangedPayload:
      type: object
      required:
        - sku
        - storeId
        - quantity
        - reason
        - recordedAt
      properties:
        sku:
          type: string
          description: Stock keeping unit.
        storeId:
          type: string
        previousQuantity:
          type: integer
          minimum: 0
        quantity:
          type: integer
          description: On-hand quantity after the movement.
          minimum: 0
        delta:
          type: integer
          description: Signed change. Negative for consumption and waste.
        reason:
          type: string
          enum:
            - delivery
            - consumption
            - waste
            - stocktake
            - transfer
        recordedAt:
          type: string
          format: date-time
    stockDepletedPayload:
      type: object
      required:
        - sku
        - storeId
        - depletedAt
      properties:
        sku:
          type: string
        storeId:
          type: string
        affectedMenuItemIds:
          type: array
          description: Menu items the menu service must hide.
          items:
            type: string
            format: ulid
        expectedRestock:
          type: string
          format: date-time
          description: Next delivery that will restock this SKU, if known.
        depletedAt:
          type: string
          format: date-time
    pointsEarnedPayload:
      type: object
      required:
        - memberId
        - orderId
        - points
        - balanceAfter
        - earnedAt
      properties:
        memberId:
          type: string
          format: ulid
          description: Member ID, prefixed with `mbr_`.
        orderId:
          type: string
          format: ulid
        points:
          type: integer
          description: Points awarded for this order.
          minimum: 0
        balanceAfter:
          type: integer
          minimum: 0
        tier:
          $ref: '#/components/schemas/loyaltyTier'
        earnedAt:
          type: string
          format: date-time
    rewardRedeemedPayload:
      type: object
      required:
        - memberId
        - rewardId
        - pointsSpent
        - balanceAfter
        - redeemedAt
      properties:
        memberId:
          type: string
          format: ulid
        orderId:
          type: string
          format: ulid
          description: Order the reward was applied to.
        rewardId:
          type: string
          description: Catalog identifier of the redeemed reward.
          enum:
            - rwd_free_drink
            - rwd_free_pastry
            - rwd_double_shot
        pointsSpent:
          type: integer
          minimum: 1
        balanceAfter:
          type: integer
          minimum: 0
        redeemedAt:
          type: string
          format: date-time
    loyaltyTier:
      type: string
      description: Membership tier at the time of the event.
      enum:
        - bronze
        - silver
        - gold
    priceQuoteRequestPayload:
      type: object
      required:
        - quoteId
        - storeId
        - lines
        - requestedAt
      properties:
        quoteId:
          type: string
          format: ulid
          description: Quote ID, prefixed with `qte_`.
        storeId:
          type: string
        memberId:
          type: string
          format: ulid
          description: Present when the customer is signed in — unlocks tier pricing.
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - menuItemId
              - quantity
            properties:
              menuItemId:
                type: string
                format: ulid
              quantity:
                type: integer
                minimum: 1
        requestedAt:
          type: string
          format: date-time
    priceQuoteProvidedPayload:
      type: object
      required:
        - quoteId
        - subtotal
        - total
        - currency
        - expiresAt
      properties:
        quoteId:
          type: string
          format: ulid
        subtotal:
          type: integer
          description: Sum of line prices before discount and tax, in cents.
          minimum: 0
        discount:
          type: integer
          description: Discount applied, in cents.
          minimum: 0
        tax:
          type: integer
          description: Tax charged, in cents.
          minimum: 0
        total:
          type: integer
          description: Amount to charge, in cents.
          minimum: 0
        currency:
          $ref: '#/components/schemas/currency'
        expiresAt:
          type: string
          format: date-time
          description: Quotes are valid for five minutes.
    priceQuoteRejectedPayload:
      type: object
      required:
        - quoteId
        - code
        - message
        - rejectedAt
      properties:
        quoteId:
          type: string
          format: ulid
        code:
          type: string
          enum:
            - UNKNOWN_MENU_ITEM
            - STORE_CLOSED
            - PRICE_LIST_UNAVAILABLE
        message:
          type: string
          description: Human-readable explanation shown on the terminal.
        rejectedAt:
          type: string
          format: date-time
    deadLetterPayload:
      type: object
      required:
        - originalTopic
        - originalPartition
        - originalOffset
        - consumerGroup
        - error
        - failedAt
      properties:
        originalTopic:
          type: string
        originalPartition:
          type: integer
          minimum: 0
        originalOffset:
          type: integer
          minimum: 0
        originalKey:
          type: string
          description: Key of the failed record.
        originalValue:
          type: string
          description: The failed record value, kept as a raw string so it can be replayed byte for byte.
        consumerGroup:
          type: string
          description: Group that gave up on the record.
        error:
          type: string
          description: Exception message from the final attempt.
        failedAt:
          type: string
          format: date-time
