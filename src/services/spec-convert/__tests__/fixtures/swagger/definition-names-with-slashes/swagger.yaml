swagger: '2.0'
info:
  version: '1.0'
  title: Redocly Cafe
paths:
  /orders:
    post:
      operationId: createOrder
      parameters:
        - name: order
          description: The order draft.
          in: body
          schema:
            $ref: '#/definitions/Order~1Draft'
          required: true
      responses:
        204:
          description: Draft saved.
        422:
          description: Draft rejected.
          schema:
            $ref: '#/definitions/Problem~1422'
definitions:
  Order/Draft:
    type: object
    properties:
      table_number:
        description: Table the order goes to.
        type: string
        example: '12'
    required: [table_number]
  Problem/422:
    type: object
    properties:
      code:
        type: string
        example: '422'
      title:
        type: string
        example: Unknown table
