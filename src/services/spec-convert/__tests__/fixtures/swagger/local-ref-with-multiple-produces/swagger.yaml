swagger: '2.0'
info:
  version: '1.0'
  title: Redocly Cafe
produces:
  - application/json
  - text/xml
paths:
  '/orders/{orderId}':
    get:
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          type: string
      responses:
        '200':
          description: The order and its previous version.
          schema:
            type: object
            properties:
              current:
                title: Order snapshot
                type: object
                properties:
                  status:
                    type: string
                    description: Where the order is right now.
              previous:
                $ref: '#/paths/~1orders~1%7BorderId%7D/get/responses/200/schema/properties/current'
