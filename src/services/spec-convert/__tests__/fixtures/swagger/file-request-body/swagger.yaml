swagger: '2.0'
info:
  title: Redocly Cafe
  version: 1.0.0
consumes:
  - image/png
paths:
  '/menu/{menuItemId}/photo':
    put:
      operationId: replaceMenuPhoto
      parameters:
        - name: menuItemId
          in: path
          required: true
          type: string
        - name: photo
          in: header
          type: file
          required: true
          x-max-size: 2MB
      responses:
        '204':
          description: Photo replaced.
          schema:
            type: file
