openapi: 3.2.0
info:
  title: Redocly Cafe
  description: Browse the menu, place orders and follow them to the pickup shelf.
  version: 1.4.0
  termsOfService: https://cafe.example.test/house-rules
  contact:
    email: hello@cafe.example.test
  license:
    name: Cafe internal use
    url: https://cafe.example.test/license
tags:
  - name: menu
    description: Drinks and food on offer.
    externalDocs:
      description: Allergen guide
      url: https://cafe.example.test/allergens
  - name: orders
    description: Orders and their items.
paths:
  /menu:
    get:
      tags:
        - menu
      summary: List menu items
      operationId: listMenuItems
      parameters:
        - name: category
          in: query
          description: Categories to include.
          required: true
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - coffee
                - tea
                - pastry
              default: coffee
      responses:
        '200':
          description: Menu items in the chosen categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
        '400':
          description: Unknown category.
      security:
        - OAuth2:
            - menu:read
    post:
      tags:
        - menu
      summary: Add a menu item
      operationId: createMenuItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItem'
          application/xml:
            schema:
              $ref: '#/components/schemas/MenuItem'
        description: Item to put on the menu.
        required: true
      responses:
        '405':
          description: The item could not be added.
      security:
        - OAuth2:
            - menu:write
            - menu:read
  /menu/{menuItemId}:
    get:
      tags:
        - menu
      summary: Get one menu item
      operationId: getMenuItem
      parameters:
        - name: menuItemId
          in: path
          description: Item to look up.
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 999
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '404':
          description: No such item.
      security:
        - ApiKey: []
    post:
      tags:
        - menu
      summary: Update an item with form data
      operationId: updateMenuItemWithForm
      parameters:
        - name: menuItemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  description: New name for the item.
                  type: string
                status:
                  description: New availability.
                  type: string
      responses:
        '405':
          description: Invalid form.
    delete:
      tags:
        - menu
      summary: Remove a menu item
      operationId: deleteMenuItem
      parameters:
        - name: X-Manager-Key
          in: header
          required: false
          schema:
            type: string
        - name: menuItemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '404':
          description: No such item.
  /menu/{menuItemId}/photo:
    post:
      tags:
        - menu
      summary: Upload a photo of the item
      operationId: uploadMenuItemPhoto
      parameters:
        - name: menuItemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                caption:
                  description: Caption for the photo.
                  type: string
                file:
                  description: The photo.
                  type: string
                  format: binary
      responses:
        '200':
          description: Photo stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
  /orders:
    post:
      tags:
        - orders
      summary: Place an order
      operationId: createOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
        required: true
      responses:
        '200':
          description: Order placed.
          headers:
            X-Ready-In:
              description: Minutes until pickup.
              schema:
                type: integer
                format: int32
            X-Ready-At:
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders/{orderId}:
    get:
      tags:
        - orders
      summary: Get an order
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 10
      responses:
        '200':
          description: The order.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Order'
externalDocs:
  description: Cafe handbook
  url: https://cafe.example.test/handbook
servers:
  - url: https://cafe.example.test/v1
  - url: http://cafe.example.test/v1
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://auth.cafe.example.test/authorize
          scopes:
            menu:read: See the menu.
            menu:write: Change the menu.
    ApiKey:
      type: apiKey
      name: api_key
      in: header
  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
        menuItemId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        pickupAt:
          type: string
          format: date-time
        status:
          type: string
          description: Where the order is.
          enum:
            - placed
            - brewing
            - ready
        paid:
          type: boolean
          default: false
      xml:
        name: Order
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      xml:
        name: Category
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
      xml:
        name: OrderItem
    MenuItem:
      type: object
      required:
        - name
        - photoUrls
      properties:
        id:
          type: integer
          format: int64
        category:
          $ref: '#/components/schemas/Category'
        name:
          type: string
          example: Flat white
        photoUrls:
          type: array
          xml:
            name: photoUrl
            wrapped: true
          items:
            type: string
        extras:
          type: array
          xml:
            name: extra
            wrapped: true
          items:
            $ref: '#/components/schemas/OrderItem'
        status:
          type: string
          description: Availability today.
          enum:
            - available
            - sold-out
      xml:
        name: MenuItem
    UploadResult:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
