swagger: '2.0'
info:
  title: Redocly Cafe
  description: Place and track orders.
  version: '0.4.2'
  contact:
    email: orders@cafe.example.test
host: cafe.example.test
schemes:
  - https
paths:
  /orders:
    post:
      summary: Place an order.
      parameters:
        - name: order
          description: What the guest asked for.
          in: body
          schema:
            $ref: '#/definitions/NewOrder'
          required: true
      responses:
        201:
          description: Order placed.
        422:
          description: The order could not be accepted.
          schema:
            $ref: '#/definitions/OrderProblem'
definitions:
  NewOrder:
    type: object
    properties:
      table_number:
        description: Table the order goes to.
        type: string
        example: '07'
      pager_number:
        description: Pager handed to the guest.
        type: string
        example: '0042'
    required: [table_number]
  OrderProblem:
    type: object
    properties:
      code:
        type: string
        example: '422'
      title:
        type: string
        example: Kitchen closed
      detail:
        type: string
        example: Hot food is served until 21:00
