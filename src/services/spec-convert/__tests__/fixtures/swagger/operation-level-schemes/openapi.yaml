openapi: 3.2.0
info:
  title: Redocly Cafe
  version: 1.0.0
paths:
  /menu:
    get:
      operationId: listMenuItems
      responses:
        '200':
          description: The menu.
      servers:
        - url: http://cafe.example.test/v1
  /orders:
    get:
      operationId: listOrders
