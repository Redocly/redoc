swagger: '2.0'
info:
  title: Redocly Cafe
  version: 1.0.0
host: Cafe.Example.Test
basePath: /v1
schemes:
  - https
paths:
  /menu:
    get:
      operationId: listMenuItems
      schemes:
        - http
        - https
      responses:
        '200':
          description: The menu.
  /orders:
    get:
      operationId: listOrders
      schemes:
        - https
      responses:
        '200':
          description: Orders.
  /order-items:
    get:
      operationId: listOrderItems
      x-servers:
        - url: https://items.cafe.example.test
      responses:
        '200':
          description: Order items.
