name: Release

on:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.repository == 'Redocly/redoc'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.published-packages }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.21.0
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci

      # The changesets action takes the GitHub Release notes from the CHANGELOG heading that
      # equals the version; without one it posts the whole file and fails after npm publish.
      # `changeset version` writes that heading as `## <version>`.
      - name: Check CHANGELOG entry
        run: |
          VERSION=$(node -p "require('./package.json').version")
          grep -qxF "## $VERSION" CHANGELOG.md || {
            echo "::error file=CHANGELOG.md::Add a '## $VERSION' heading with the release notes"
            exit 1
          }

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npm run release
          commit-message: 'chore: 🔖 release new versions'
          pr-title: 'chore: 🔖 release new versions'

      - name: Upload bundle artifact
        if: steps.changesets.outputs.published == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle
          path: bundles
          if-no-files-found: error

  dockerhub:
    needs: [release]
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
      actions: write
    uses: ./.github/workflows/docker.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-cdn:
    name: Publish to CDN
    needs: [release]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Download bundle artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle
          path: bundles
      - name: Publish to S3
        run: ./scripts/publish-cdn.sh
        shell: bash

  invalidate-cache:
    name: Clear cache
    runs-on: ubuntu-latest
    needs: [release, publish-cdn]
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Invalidate cache
        run: ./scripts/clear-cache.sh
        shell: bash
        env:
          DISTRIBUTION: ${{ secrets.DISTRIBUTION }}